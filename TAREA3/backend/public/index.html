<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastro | Panel en tiempo real</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { color-scheme: light; --ink:#152522; --muted:#6a7975; --line:#d9e3df; --accent:#087f72; --paper:#fff; --wash:#eef4f0; --ok:#159b65; --warn:#c77700; --bad:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--wash); font:15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    button { cursor:pointer; border:0; border-radius:8px; padding:9px 13px; color:#fff; background:var(--accent); font-weight:700; }
    button.secondary { background:#e1ebe7; color:var(--ink); }
    input { width:100%; border:1px solid var(--line); padding:9px 12px; border-radius:8px; background:#fff; }
    .shell { height:100vh; display:grid; grid-template-columns:340px 1fr; grid-template-rows:62px 1fr; }
    header { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 22px; background:var(--paper); border-bottom:1px solid var(--line); }
    header strong { font-size:19px; }
    .status { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
    aside { overflow:auto; background:var(--paper); border-right:1px solid var(--line); padding:16px; }
    .tools { display:flex; gap:8px; margin:12px 0; }
    .device { width:100%; text-align:left; color:var(--ink); background:transparent; border-bottom:1px solid var(--line); border-radius:0; padding:13px 8px; font-weight:600; }
    .device:hover,.device.active { background:#edf7f3; }
    .device-top { display:flex; justify-content:space-between; gap:8px; }
    .device small { display:block; color:var(--muted); margin-top:4px; font-weight:400; }
    .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#aab8b3; margin-right:6px; }
    .dot.online { background:var(--ok); box-shadow:0 0 0 3px #159b6530; }
    .count { color:var(--muted); font-size:13px; }
    main { position:relative; }
    #map { height:100%; width:100%; }
    .details { position:absolute; z-index:1000; right:16px; bottom:16px; width:min(340px,calc(100% - 32px)); padding:16px; border-radius:12px; background:#fffffff2; box-shadow:0 10px 30px #173b3224; }
    .details h2 { font-size:17px; margin:0 0 10px; }
    .metric { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
    .metric span { color:var(--muted); }
    .follow { position:absolute; z-index:1000; left:16px; bottom:16px; }
    .lat-ok { color:var(--ok); } .lat-warn { color:var(--warn); } .lat-bad { color:var(--bad); }
    .arrow { width:30px; height:30px; transition:none; }
    .arrow svg { width:30px; height:30px; display:block; filter:drop-shadow(0 1px 2px #0005); }
    @media (max-width:800px) {
      .shell { grid-template-columns:1fr; grid-template-rows:62px auto 60vh; height:auto; min-height:100vh; }
      aside { max-height:300px; border-right:0; border-bottom:1px solid var(--line); }
      main { min-height:60vh; } header { padding:0 14px; }
    }
  </style>
</head>
<body>
  <section class="shell">
    <header>
      <strong>Rastro · tiempo real</strong>
      <div class="status"><i id="connDot" class="dot"></i><span id="connection">Conectando...</span></div>
    </header>
    <aside>
      <div class="count" id="count">0 dispositivos</div>
      <div class="tools"><input id="search" placeholder="Buscar dispositivo"><button id="filter" class="secondary" title="Filtrar estado">Todos</button></div>
      <div id="devices"></div>
      <p class="count" id="metrics"></p>
    </aside>
    <main>
      <div id="map"></div>
      <button id="follow" class="follow" title="Seguir al dispositivo seleccionado">Siguiendo</button>
      <section id="details" class="details"><h2>Selecciona un dispositivo</h2><p class="count">Los celulares conectados aparecerán aquí.</p></section>
    </main>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const CARTO_KEY = 'cb1_4f7e_1_cec811c28cf2ef52dd7565da';
    // Rutas relativas: el panel funciona tanto en "/" como detrás de Nginx en "/movimiento/".
    const BASE = location.pathname.replace(/[^/]*$/, '');
    const $ = (id) => document.getElementById(id);
    const state = {
      devices: new Map(), selected: null, onlineOnly: false, follow: true,
      tracks: new Map(), // deviceId -> { marker, accuracy, route, anim, last, prevTime, hz }
      clockOffset: 0, rtt: null,
    };

    async function api(path) {
      const response = await fetch(BASE + path, { cache: 'no-store' });
      if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || ('HTTP ' + response.status));
      return response.json();
    }

    const map = L.map('map', { zoomControl: true }).setView([-13.53195, -71.96746], 14);
    L.tileLayer(`https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
      maxZoom: 20, maxNativeZoom: 18, // CARTO no publica z19+ (403)
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
    }).addTo(map);
    // Si el usuario arrastra el mapa se desactiva el seguimiento automático.
    map.on('dragstart', () => setFollow(false));

    function setFollow(value) {
      state.follow = value;
      $('follow').textContent = value ? 'Siguiendo' : 'Seguir';
      $('follow').classList.toggle('secondary', !value);
      if (value) centerSelected();
    }
    $('follow').onclick = () => setFollow(!state.follow);

    function arrowIcon(online) {
      const color = online ? '#087f72' : '#7b8a86';
      return L.divIcon({
        className: 'arrow', iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13" fill="${color}" stroke="#fff" stroke-width="3"/><path d="M15 6 L21 21 L15 17.5 L9 21 Z" fill="#fff"/></svg>`,
      });
    }

    function getTrack(deviceId) {
      let track = state.tracks.get(deviceId);
      if (!track) {
        track = { marker: null, accuracy: null, route: null, anim: null, last: null, prevTime: null, hz: 0, heading: 0 };
        state.tracks.set(deviceId, track);
      }
      return track;
    }

    function setHeading(track, heading) {
      if (heading == null || !Number.isFinite(heading)) return;
      track.heading = heading;
      const svg = track.marker?.getElement()?.querySelector('svg');
      if (svg) svg.style.transform = `rotate(${heading}deg)`;
    }

    // Aplica una muestra al mapa. animate=false para el estado inicial.
    function applyLocation(loc, animate) {
      const device = state.devices.get(loc.deviceId);
      const track = getTrack(loc.deviceId);
      const point = L.latLng(loc.latitude, loc.longitude);
      const time = Date.parse(loc.timestamp);
      if (track.last && time < Date.parse(track.last.timestamp)) {
        // Muestra antigua (cola offline): solo completa la ruta.
        return;
      }
      const interval = track.prevTime ? time - track.prevTime : 500;
      if (track.prevTime && interval > 0) {
        const hz = 1000 / interval;
        track.hz = track.hz ? track.hz * 0.8 + hz * 0.2 : hz;
      }
      track.prevTime = time;
      track.last = loc;

      if (!track.marker) {
        track.marker = L.marker(point, { icon: arrowIcon(device?.online ?? true), zIndexOffset: 1000 })
          .addTo(map).bindTooltip(escapeHtml(device?.name || loc.deviceId));
        track.marker.on('click', () => selectDevice(loc.deviceId));
        track.accuracy = L.circle(point, { radius: loc.accuracy || 0, color: '#087f72', weight: 1, fillOpacity: 0.08, interactive: false }).addTo(map);
      } else if (animate) {
        // Interpolación suave hasta la nueva posición (dura como máximo el intervalo entre muestras).
        const from = track.marker.getLatLng();
        const duration = Math.min(800, Math.max(120, interval * 0.9));
        track.anim = { from, to: point, start: performance.now(), duration };
      } else {
        track.marker.setLatLng(point);
      }
      track.accuracy.setRadius(loc.accuracy || 0);
      if (!animate) track.accuracy.setLatLng(point);

      const heading = loc.speed > 0.8 && loc.heading != null ? loc.heading : null;
      setHeading(track, heading ?? track.heading);

      if (state.selected === loc.deviceId) {
        if (!track.route) track.route = L.polyline([], { color: '#087f72', weight: 5, opacity: 0.85 }).addTo(map);
        track.route.addLatLng(point);
        scheduleDetails();
      }
    }

    function animationLoop(now) {
      for (const [deviceId, track] of state.tracks) {
        if (!track.anim) continue;
        const progress = Math.min(1, (now - track.anim.start) / track.anim.duration);
        const lat = track.anim.from.lat + (track.anim.to.lat - track.anim.from.lat) * progress;
        const lng = track.anim.from.lng + (track.anim.to.lng - track.anim.from.lng) * progress;
        const point = L.latLng(lat, lng);
        track.marker.setLatLng(point);
        track.accuracy.setLatLng(point);
        if (progress >= 1) track.anim = null;
        if (state.follow && state.selected === deviceId) map.panTo(point, { animate: false });
      }
      requestAnimationFrame(animationLoop);
    }
    requestAnimationFrame(animationLoop);

    function centerSelected() {
      const track = state.tracks.get(state.selected);
      if (track?.marker) map.setView(track.marker.getLatLng(), Math.max(map.getZoom(), 17), { animate: false });
    }

    async function loadDevices() {
      const result = await api('api/devices');
      for (const device of result.devices) state.devices.set(device.deviceId, device);
      scheduleRender();
      if (!state.selected) {
        const first = result.devices.find((d) => d.online) || result.devices[0];
        if (first) selectDevice(first.deviceId);
      }
    }

    let renderQueued = false;
    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      setTimeout(() => { renderQueued = false; renderDevices(); }, 250);
    }

    function renderDevices() {
      const query = $('search').value.toLowerCase();
      const all = [...state.devices.values()].sort((a, b) => (b.online - a.online) || a.name.localeCompare(b.name));
      const visible = all.filter((d) => (!state.onlineOnly || d.online) && `${d.name} ${d.model || ''}`.toLowerCase().includes(query));
      $('count').textContent = `${all.filter((d) => d.online).length}/${all.length} conectados`;
      $('devices').innerHTML = visible.map((d) => `
        <button class="device ${state.selected === d.deviceId ? 'active' : ''}" data-id="${escapeHtml(d.deviceId)}">
          <div class="device-top"><span><i class="dot ${d.online ? 'online' : ''}"></i>${escapeHtml(d.name)}</span><span>${d.battery ?? '--'}%</span></div>
          <small>${escapeHtml(d.model || d.platform)} · ${d.online ? 'online' : 'offline'}<br>Última señal: ${d.lastSeen ? new Date(d.lastSeen).toLocaleTimeString() : '--'}</small>
        </button>`).join('');
      document.querySelectorAll('.device').forEach((element) => { element.onclick = () => selectDevice(element.dataset.id); });
    }

    async function selectDevice(deviceId) {
      if (state.selected && state.selected !== deviceId) {
        const previous = state.tracks.get(state.selected);
        previous?.route?.remove();
        if (previous) previous.route = null;
      }
      state.selected = deviceId;
      renderDevices();
      try {
        const history = await api(`api/devices/${encodeURIComponent(deviceId)}/history?activeOnly=true`);
        const latest = history.locations.at(-1) || (await api(`api/devices/${encodeURIComponent(deviceId)}/location`)).lastKnown;
        const track = getTrack(deviceId);
        track.route?.remove();
        track.route = L.polyline(history.locations.map((p) => [p.latitude, p.longitude]), { color: '#087f72', weight: 5, opacity: 0.85 }).addTo(map);
        if (latest) {
          track.last = null;
          applyLocation(latest, false);
          setFollow(true);
        }
        renderDetails();
      } catch (error) {
        $('details').innerHTML = `<h2>Error</h2><p>${escapeHtml(error.message)}</p>`;
      }
    }

    let detailsQueued = false;
    function scheduleDetails() {
      if (detailsQueued) return;
      detailsQueued = true;
      requestAnimationFrame(() => { detailsQueued = false; renderDetails(); });
    }

    function latencyClass(ms) {
      if (ms == null) return '';
      return ms < 1000 ? 'lat-ok' : ms < 3000 ? 'lat-warn' : 'lat-bad';
    }

    function renderDetails() {
      const device = state.devices.get(state.selected);
      if (!device) return;
      const track = state.tracks.get(state.selected);
      const loc = track?.last;
      const age = loc ? Date.now() + state.clockOffset - Date.parse(loc.timestamp) : null;
      $('details').innerHTML = `
        <h2>${escapeHtml(device.name)}</h2>
        <div class="metric"><span>Estado</span><strong>${device.online ? 'Online' : 'Offline'}</strong></div>
        <div class="metric"><span>Modelo</span><strong>${escapeHtml(device.model || device.platform || '--')}</strong></div>
        <div class="metric"><span>Latencia GPS → servidor</span><strong class="${latencyClass(loc?.latencyMs)}">${loc?.latencyMs != null ? `${loc.latencyMs.toFixed(0)} ms` : '--'}</strong></div>
        <div class="metric"><span>Antigüedad del dato</span><strong class="${latencyClass(age)}">${age != null ? `${(age / 1000).toFixed(1)} s` : '--'}</strong></div>
        <div class="metric"><span>Frecuencia</span><strong>${track?.hz ? `${track.hz.toFixed(1)} Hz` : '--'}</strong></div>
        <div class="metric"><span>Velocidad</span><strong>${loc?.speed != null ? `${(loc.speed * 3.6).toFixed(1)} km/h` : '--'}</strong></div>
        <div class="metric"><span>Precisión</span><strong>${loc?.accuracy != null ? `± ${loc.accuracy.toFixed(1)} m` : '--'}</strong></div>
        <div class="metric"><span>Coordenadas</span><strong>${loc ? `${loc.latitude.toFixed(6)}, ${loc.longitude.toFixed(6)}` : '--'}</strong></div>
        <div class="metric"><span>Batería</span><strong>${device.battery ?? '--'}%</strong></div>`;
    }
    setInterval(renderDetails, 1000);

    function connectSocket() {
      const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}${BASE}ws`);
      let pingTimer = null;
      const setConn = (text, ok) => { $('connection').textContent = text; $('connDot').classList.toggle('online', ok); };
      socket.onopen = () => {
        setConn('Tiempo real conectado', true);
        const ping = () => socket.readyState === 1 && socket.send(JSON.stringify({ type: 'ping', t: Date.now() }));
        ping();
        pingTimer = setInterval(ping, 5000);
        // Al reconectar se recargan dispositivos para no perder cambios.
        loadDevices().catch(() => {});
      };
      socket.onclose = () => {
        clearInterval(pingTimer);
        setConn('Reconectando...', false);
        setTimeout(connectSocket, 1000);
      };
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'pong') {
          const now = Date.now();
          state.rtt = now - message.t;
          state.clockOffset = message.serverTime - (message.t + state.rtt / 2);
          setConn(`Tiempo real · RTT ${state.rtt} ms`, true);
        } else if (message.type === 'device.updated') {
          const known = state.devices.get(message.data.deviceId);
          state.devices.set(message.data.deviceId, { ...known, ...message.data });
          const track = state.tracks.get(message.data.deviceId);
          if (track?.marker) { track.marker.setIcon(arrowIcon(message.data.online)); setHeading(track, track.heading); }
          scheduleRender();
          if (!state.selected) selectDevice(message.data.deviceId);
        } else if (message.type === 'location.updated') {
          const loc = message.data;
          const device = state.devices.get(loc.deviceId);
          if (!device) { loadDevices().catch(() => {}); return; }
          device.lastSeen = loc.receivedAt;
          if (loc.battery != null) device.battery = loc.battery;
          device.online = true;
          if (loc.live === false) return; // Cola offline: no mover el marcador hacia atrás.
          applyLocation(loc, true);
          scheduleRender();
        }
      };
    }

    async function loadMetrics() {
      try {
        const m = await api('api/metrics');
        $('metrics').textContent = m.p95Ms == null
          ? 'Sin muestras de latencia todavía.'
          : `Latencia P50 ${m.p50Ms.toFixed(0)} ms · P95 ${m.p95Ms.toFixed(0)} ms · <1 s: ${m.under1000Percent.toFixed(1)}% (${m.samples} muestras)`;
      } catch (_) { /* sin métricas */ }
    }
    setInterval(loadMetrics, 5000);
    setInterval(() => loadDevices().catch(() => {}), 30000);

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }
    $('search').oninput = renderDevices;
    $('filter').onclick = () => {
      state.onlineOnly = !state.onlineOnly;
      $('filter').textContent = state.onlineOnly ? 'Online' : 'Todos';
      renderDevices();
    };
    setTimeout(() => map.invalidateSize(), 50);
    loadDevices().catch((error) => { $('connection').textContent = error.message; }).finally(() => { connectSocket(); loadMetrics(); });
  </script>
</body>
</html>
