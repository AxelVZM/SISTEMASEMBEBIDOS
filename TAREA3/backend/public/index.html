<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastro | Panel de dispositivos</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { color-scheme: light; --ink:#152522; --muted:#6a7975; --line:#d9e3df; --accent:#087f72; --paper:#fff; --wash:#eef4f0; }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--wash); font:15px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; border:0; border-radius:8px; padding:10px 14px; color:#fff; background:var(--accent); font-weight:700; } button.secondary { background:#e1ebe7; color:var(--ink); }
    .hidden { display:none !important; } .login { min-height:100vh; display:grid; place-items:center; padding:24px; background:linear-gradient(140deg,#dcece4,#f6f8f2); }
    .login-card { width:min(420px,100%); background:var(--paper); padding:32px; border-radius:14px; box-shadow:0 18px 60px #173b3220; } h1,h2,p { margin-top:0; } h1 { font-size:28px; margin-bottom:8px; } label { display:block; margin:18px 0 6px; font-weight:700; } input { width:100%; border:1px solid var(--line); padding:11px 12px; border-radius:8px; background:#fff; } .error { color:#b42318; min-height:22px; margin:12px 0; }
    .shell { height:100vh; display:grid; grid-template-columns:350px 1fr; grid-template-rows:66px 1fr; } header { grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; padding:0 24px; background:var(--paper); border-bottom:1px solid var(--line); } header strong { font-size:20px; } .status { color:var(--muted); font-size:13px; } aside { overflow:auto; background:var(--paper); border-right:1px solid var(--line); padding:18px; } .tools { display:flex; gap:8px; margin:14px 0; } .tools input { flex:1; } .device { width:100%; text-align:left; color:var(--ink); background:transparent; border-bottom:1px solid var(--line); border-radius:0; padding:15px 8px; } .device:hover,.device.active { background:#edf7f3; } .device-top { display:flex; justify-content:space-between; gap:8px; } .device small { display:block; color:var(--muted); margin-top:5px; font-weight:400; } .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#aab8b3; margin-right:6px; } .dot.online { background:#159b65; } main { position:relative; } #map { height:100%; width:100%; } .details { position:absolute; z-index:1000; right:18px; bottom:18px; width:min(360px,calc(100% - 36px)); padding:18px; border-radius:12px; background:#fffffff2; box-shadow:0 10px 30px #173b3224; } .details h2 { font-size:18px; margin-bottom:12px; } .metric { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); } .metric span { color:var(--muted); } .count { color:var(--muted); font-size:13px; }
    @media (max-width:800px) { .shell { grid-template-columns:1fr; grid-template-rows:66px auto 55vh; height:auto; min-height:100vh; } aside { max-height:360px; border-right:0; border-bottom:1px solid var(--line); } main { min-height:55vh; } header { padding:0 14px; } }
  </style>
</head>
<body>
  <section id="app" class="shell"><header><strong>Rastro / dispositivos</strong><div><span id="connection" class="status">Conectando...</span></div></header><aside><div class="count" id="count">0 dispositivos</div><div class="tools"><input id="search" placeholder="Buscar dispositivo"><button id="filter" class="secondary" title="Filtrar estado">Todos</button></div><div id="devices"></div></aside><main><div id="map"></div><section id="details" class="details"><h2>Selecciona un dispositivo</h2><p class="status">Los celulares conectados aparecerán aquí.</p></section></main></section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const state = { devices: [], selected: null, onlineOnly: false, markers: new Map(), routes: new Map(), metrics: null };
    const $ = (id) => document.getElementById(id);
    const api = async (path, options = {}) => { const response = await fetch(path, options); if (!response.ok) throw new Error((await response.json().catch(() => ({}))).error || ('HTTP ' + response.status)); return response.json(); };
    const map = L.map('map').setView([-13.53195, -71.96746], 13); L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'&copy; OpenStreetMap contributors' }).addTo(map);
    function showApp() { setTimeout(() => map.invalidateSize(), 50); }
    async function loadDevices() { const result = await api('/api/devices'); state.devices = result.devices; renderDevices(); if (!state.selected && state.devices[0]) selectDevice(state.devices[0].deviceId); }
    function renderDevices() { const query = $('search').value.toLowerCase(); const visible = state.devices.filter((d) => (!state.onlineOnly || d.online) && `${d.name} ${d.model || ''}`.toLowerCase().includes(query)); $('count').textContent = `${state.devices.filter((d) => d.online).length}/${state.devices.length} conectados`; $('devices').innerHTML = visible.map((d) => `<button class="device ${state.selected === d.deviceId ? 'active':''}" data-id="${d.deviceId}"><div class="device-top"><span><i class="dot ${d.online ? 'online':''}"></i>${escapeHtml(d.name)}</span><span>${d.battery ?? '--'}%</span></div><small>${escapeHtml(d.model || d.platform)} · ${d.online ? 'online':'offline'}<br>Última conexión: ${new Date(d.lastSeen).toLocaleString()}</small></button>`).join(''); document.querySelectorAll('.device').forEach((element) => element.onclick = () => selectDevice(element.dataset.id)); }
    async function selectDevice(deviceId) { state.selected = deviceId; renderDevices(); const device = state.devices.find((item) => item.deviceId === deviceId); try { const [latest, history] = await Promise.all([api(`/api/devices/${deviceId}/location`), api(`/api/devices/${deviceId}/history?activeOnly=true`)]); renderDetails(device, latest.location); drawRoute(deviceId, history.locations); if (latest.location) { const point = [latest.location.latitude, latest.location.longitude]; map.setView(point, 16); state.markers.get(deviceId)?.openPopup(); } } catch (error) { $('details').innerHTML = `<h2>Error</h2><p>${escapeHtml(error.message)}</p>`; } }
    function renderDetails(device, location) { $('details').innerHTML = `<h2>${escapeHtml(device.name)}</h2><div class="metric"><span>Estado</span><strong>${device.online ? 'Online':'Offline'}</strong></div><div class="metric"><span>Tipo</span><strong>${escapeHtml(device.platform)}</strong></div><div class="metric"><span>Modelo</span><strong>${escapeHtml(device.model || 'No disponible')}</strong></div><div class="metric"><span>Última actualización</span><strong>${location ? new Date(location.timestamp).toLocaleString():'Sin datos'}</strong></div><div class="metric"><span>Latencia estimada</span><strong>${location?.latencyMs != null ? `${location.latencyMs.toFixed(0)} ms`:'--'}</strong></div><div class="metric"><span>Coordenadas</span><strong>${location ? `${location.latitude.toFixed(6)}, ${location.longitude.toFixed(6)}`:'--'}</strong></div><div class="metric"><span>Precisión</span><strong>${location?.accuracy ? `${location.accuracy.toFixed(1)} m`:'--'}</strong></div><div class="metric"><span>Velocidad</span><strong>${location?.speed ? `${(location.speed * 3.6).toFixed(1)} km/h`:'0 km/h'}</strong></div>`; }
    function drawRoute(deviceId, locations) { if (state.routes.has(deviceId)) state.routes.get(deviceId).remove(); state.routes.delete(deviceId); const line = locations.length ? L.polyline(locations.map((p) => [p.latitude,p.longitude]), {color:'#087f72', weight:4}).addTo(map) : null; if (line) state.routes.set(deviceId, line); const latest = locations.at(-1); if (latest) { if (state.markers.has(deviceId)) state.markers.get(deviceId).setLatLng([latest.latitude,latest.longitude]); else state.markers.set(deviceId, L.marker([latest.latitude,latest.longitude]).addTo(map).bindPopup(escapeHtml(state.devices.find((d) => d.deviceId === deviceId)?.name || deviceId))); } else if (state.markers.has(deviceId)) { state.markers.get(deviceId).remove(); state.markers.delete(deviceId); } }
    function connectSocket() { const prefix = location.pathname.replace(/\/?$/, ''); const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss':'ws'}://${location.host}${prefix}/ws`); socket.onopen = () => $('connection').textContent = 'Tiempo real conectado'; socket.onclose = () => { $('connection').textContent = 'Tiempo real desconectado'; setTimeout(connectSocket, 3000); }; socket.onmessage = (event) => { const message = JSON.parse(event.data); if (message.type === 'location.updated') { const device = state.devices.find((d) => d.deviceId === message.data.deviceId); if (device) { device.lastSeen = message.data.timestamp; device.battery = message.data.battery; device.online = true; renderDevices(); if (state.selected === message.data.deviceId) { renderDetails(device, message.data); const point = [message.data.latitude,message.data.longitude]; if (state.markers.has(device.deviceId)) state.markers.get(device.deviceId).setLatLng(point); else state.markers.set(device.deviceId, L.marker(point).addTo(map)); const route = state.routes.get(device.deviceId); if (route) route.addLatLng(point); else state.routes.set(device.deviceId, L.polyline([point], {color:'#087f72', weight:4}).addTo(map)); } } } }; }
    async function loadMetrics() { try { state.metrics = await api('/api/metrics'); $('connection').title = state.metrics.p95Ms == null ? 'Sin muestras de latencia' : `P95: ${state.metrics.p95Ms.toFixed(0)} ms · <1s: ${state.metrics.under1000Percent.toFixed(1)}%`; } catch (_) {} }
    setInterval(() => { loadDevices().catch(() => {}); loadMetrics(); }, 30000);
    function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); }
    $('search').oninput = renderDevices; $('filter').onclick = () => { state.onlineOnly = !state.onlineOnly; $('filter').textContent = state.onlineOnly ? 'Online':'Todos'; renderDevices(); };
    showApp(); loadDevices().then(() => { connectSocket(); loadMetrics(); }).catch((error) => { $('connection').textContent = error.message; });
  </script>
</body>
</html>
