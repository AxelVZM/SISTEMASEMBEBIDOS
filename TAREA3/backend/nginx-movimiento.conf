# Bloques para Movimiento GPS (TAREA3). Van DENTRO del bloque `server { ... }`
# existente de Nginx, sin tocar el `location /` de Andes Maqanakuy (TAREA2).

# WebSocket en tiempo real (celulares y panel).
location /movimiento/ws {
    proxy_pass http://127.0.0.1:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    tcp_nodelay on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# API REST y panel web.
location /movimiento/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    tcp_nodelay on;
}
